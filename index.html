<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Luma</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <script>
            // Set the theme synchronously before React mounts to avoid a
            // flash of the wrong theme. Mirrors the OS-preference fallback
            // in src/store/settingsStore.js, plus the legacy localStorage
            // key from the pre-Settings-page build. SQLite is the source
            // of truth once the app has booted, but at this point we have
            // no DB connection — these are just paint-time hints.
            (function () {
                try {
                    var stored = localStorage.getItem("luma:theme");
                    var theme;
                    if (stored === "light" || stored === "dark") {
                        theme = stored;
                    } else if (
                        window.matchMedia &&
                        window.matchMedia("(prefers-color-scheme: light)")
                            .matches
                    ) {
                        theme = "light";
                    } else {
                        theme = "dark";
                    }
                    document.documentElement.setAttribute("data-theme", theme);
                } catch (e) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
